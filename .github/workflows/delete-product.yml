name: AWS Deployment for DeleteProduct Service

on:
  push:
    paths:
      - 'Backend/Domain/Products/DeleteProduct/**'  
    branches: ["dev3"]
  pull_request:
    paths:
      - 'Backend/Domain/Products/DeleteProduct/**'  
    branches: ["dev1", "main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build Docker image
      run: |
        echo "🔧 Iniciando la construcción de la imagen Docker..."
        docker build Backend/Domain/Products/DeleteProduct/ --file Backend/Domain/Products/DeleteProduct/Dockerfile \
          -t ${{ secrets.DOCKER_USERNAME }}/delete-product:latest
        echo "🛠 Imagen Docker construida correctamente."

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
    - name: Deploy to AWS EC2
      uses: appleboy/ssh-action@v0.1.8
      with:
        host: ${{ secrets.EC2_HOST_DELETE_PRODUCT }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        port: 22
        script: |
          echo "🚀 Conectando a EC2 para desplegar DeleteProduct"
          
          echo "🔧 Verificando si Docker está instalado..."
          if ! command -v docker &> /dev/null; then
            echo "⚙️ Instalando Docker"
            sudo yum update -y
            sudo yum install -y docker
            sudo systemctl start docker
            sudo systemctl enable docker
            sudo usermod -aG docker ec2-user
          else
            echo "✅ Docker ya está instalado."
          fi

          # Eliminar contenedor anterior
          echo "🛑 Deteniendo contenedor anterior..."
          sudo docker stop delete-product || true
          sudo docker rm delete-product || true

          echo "📦 Descargando nueva imagen desde Docker Hub..."
          sudo docker pull ${{ secrets.DOCKER_USERNAME }}/delete-product:latest

          echo "🚀 Iniciando el contenedor DeleteProduct..."
          sudo docker run -d \
            --name delete-product \
            -p 3011:3011 \
            -e MONGO_URI="mongodb://${{ secrets.MONGODB_USER }}:${{ secrets.MONGODB_PASSWORD }}@${{ secrets.EC2_HOST_MONGODB }}:27017/db_products?authSource=admin" \
            ${{ secrets.DOCKER_USERNAME }}/delete-product:latest

          echo "🔄 Verificando conexión con MongoDB..."
          sudo docker exec delete-product mongo --eval 'db.runCommand({ connectionStatus: 1 })'

          if sudo docker ps -f name=delete-product | grep delete-product; then
            echo "✅ Contenedor corriendo correctamente."
          else
            echo "❌ Error al iniciar el contenedor. Revisa los logs."
            exit 1
          fi
