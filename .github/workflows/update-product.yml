name: AWS Deployment for UpdateProduct Service

on:
  push:
    paths:
      - 'Backend/Domain/Products/UpdateProduct/**'
    branches: ["dev3"]
  pull_request:
    paths:
      - 'Backend/Domain/Products/UpdateProduct/**'
    branches: ["dev1", "main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: |
          echo "🔧 Iniciando la construcción de la imagen Docker..."
          docker build Backend/Domain/Products/UpdateProduct/ --file Backend/Domain/Products/UpdateProduct/Dockerfile \
            -t ${{ secrets.DOCKER_USERNAME }}/update-product:latest
          echo "🛠 Imagen Docker construida correctamente."

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to AWS EC2
        uses: appleboy/ssh-action@v0.1.8
        with:
          host: ${{ secrets.EC2_HOST_UPDATE_PRODUCT }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            echo "🚀 Conectando a EC2 para desplegar UpdateProduct"

            # Verificar si Docker está instalado
            if ! command -v docker &> /dev/null; then
              echo "⚙️ Instalando Docker..."
              sudo yum update -y
              sudo yum install -y docker
              sudo systemctl start docker
              sudo systemctl enable docker
              sudo usermod -aG docker ec2-user
            else
              echo "✅ Docker ya está instalado."
            fi

            # Eliminar contenedor anterior si existe
            echo "🛑 Deteniendo y eliminando contenedor previo..."
            sudo docker stop update-product || true
            sudo docker rm update-product || true

            # Descargar la nueva imagen desde Docker Hub
            echo "📦 Descargando nueva imagen..."
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/update-product:latest

            # Iniciar el contenedor con la nueva imagen
            echo "🚀 Iniciando contenedor..."
            sudo docker run -d \
              --name update-product \
              -p 3012:3012 \
              -e MONGO_URI="mongodb://${{ secrets.MONGODB_USER }}:${{ secrets.MONGODB_PASSWORD }}@${{ secrets.EC2_HOST_MONGODB }}:27017/db_products?authSource=admin" \
              ${{ secrets.DOCKER_USERNAME }}/update-product:latest

            echo "🔄 Verificando conexión con MongoDB..."
            # Se podría usar el comando mongo si está disponible, pero aquí se omite
            sudo docker exec update-product mongo --eval 'db.runCommand({ connectionStatus: 1 })' || echo "❌ Error al verificar la conexión con MongoDB"

            echo "✅ Contenedor desplegado y ejecutándose."
