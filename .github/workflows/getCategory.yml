name: AWS Deployment for GetCategory Service

on:
  push:
    paths:
      - 'Backend/Domain/Category/GetCategory/src/**'
    branches: ["dev3"]
  pull_request:
    paths:
      - 'Backend/Domain/Category/GetCategory/src/**'
    branches: ["dev1", "main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: |
          docker build Backend/Domain/Category/GetCategory/ --file Backend/Domain/Category/GetCategory/Dockerfile \
            -t ${{ secrets.DOCKER_USERNAME }}/get-category:latest

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to AWS EC2
        uses: appleboy/ssh-action@v0.1.8
        with:
          host: ${{ secrets.EC2_HOST_GET_CATEGORY }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            if ! command -v docker &> /dev/null; then
              echo "⚙️ Installing Docker..."
              sudo yum update -y
              sudo yum install -y docker
              sudo systemctl start docker
              sudo systemctl enable docker
              sudo usermod -aG docker ec2-user
            fi

            echo "🛑 Stopping and removing previous container..."
            sudo docker stop get-category || true
            sudo docker rm get-category || true

            echo "📦 Pulling new image..."
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/get-category:latest

            echo "🚀 Starting container on port 8002..."
            sudo docker run -d \
              --name get-category \
              -p 8002:8002 \
              -e DATABASE_URL="postgresql://${{ secrets.DB_USER }}:${{ secrets.DB_PASSWORD }}@${{ secrets.RDS_HOST }}:5432/${{ secrets.DB_NAME }}" \
              ${{ secrets.DOCKER_USERNAME }}/get-category:latest

            echo "✅ Container deployed and running on port 8002."
