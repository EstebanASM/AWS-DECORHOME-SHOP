name: AWS Deployment for GetProducts Service

on:
  push:
    paths:
      - 'Backend/Domain/Products/GetProducts/**'
    branches: ["dev3"]
  pull_request:
    paths:
      - 'Backend/Domain/Products/GetProducts/**'
    branches: ["dev1", "main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build Docker image
      run: |
        docker build Backend/Domain/Products/GetProducts/ --file Backend/Domain/Products/GetProducts/Dockerfile \
          -t ${{ secrets.DOCKER_USERNAME }}/get-products-db:latest

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
    - name: Deploy to AWS EC2
      uses: appleboy/ssh-action@v0.1.8
      with:
        host: ${{ secrets.EC2_HOST_GET_PRODUCTS }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        port: 22
        script: |
          echo "🚀 Conectando a EC2 para desplegar GetProducts"

          # 1️⃣ Verificar si Docker está instalado
          if ! command -v docker &> /dev/null; then
            echo "==> Instalando Docker"
            sudo yum update -y
            sudo yum install -y docker
            sudo systemctl start docker
            sudo systemctl enable docker
            sudo usermod -aG docker ec2-user
          fi

          # 2️⃣ Eliminar contenedor previo
          echo "🛑 Deteniendo contenedor anterior..."
          sudo docker stop get-products-db || true
          sudo docker rm get-products-db || true

          # 3️⃣ Descargar imagen más reciente de Docker Hub
          echo "📦 Descargando nueva imagen de GetProducts..."
          sudo docker pull ${{ secrets.DOCKER_USERNAME }}/get-products-db:latest

          # 4️⃣ Iniciar contenedor con conexión a MongoDB
          echo "🚀 Iniciando contenedor GetProducts..."
          sudo docker run -d \
            --name get-products-db \
            -p 3010:3010 \
            -e MONGO_URI="mongodb://${{ secrets.MONGODB_USER }}:${{ secrets.MONGODB_PASSWORD }}@${{ secrets.EC2_HOST_MONGODB }}:27017/db_products?authSource=admin" \
            ${{ secrets.DOCKER_USERNAME }}/get-products-db:latest

          # 5️⃣ Prueba de conexión con MongoDB
          echo "🔄 Verificando conexión con MongoDB..."
          sudo docker exec get-products-db mongo --eval 'db.runCommand({ connectionStatus: 1 })'

          if sudo docker ps -f name=get-products-db | grep get-products-db; then
            echo "✅ Contenedor corriendo correctamente."
          else
            echo "❌ Error al iniciar el contenedor. Revisa los logs."
            exit 1
          fi
