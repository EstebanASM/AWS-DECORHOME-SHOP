name: AWS Deployment for GetProducts Service

on:
  push:
    paths:
      - 'Backend/Domain/Products/GetProducts/**'
    branches: ["dev3"]
  pull_request:
    paths:
      - 'Backend/Domain/Products/GetProducts/**'
    branches: ["dev1", "main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build Docker image
      run: |
        docker build Backend/Domain/Products/GetProducts/ --file Backend/Domain/Products/GetProducts/Dockerfile \
          -t ${{ secrets.DOCKER_USERNAME }}/get-products-db:latest

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
    - name: Deploy to AWS EC2
      uses: appleboy/ssh-action@v0.1.8
      with:
        host: ${{ secrets.EC2_HOST_GET_PRODUCTS }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        port: 22
        script: |
          if ! command -v docker &> /dev/null; then
            echo "==> Installing Docker"
            sudo yum update -y
            sudo yum install -y docker
            sudo service docker start
            sudo usermod -a -G docker ec2-user
          fi

          echo "Deteniendo y eliminando contenedor previo..."
          sudo docker stop get-products-db || true
          sudo docker rm get-products-db || true

          echo "Actualizando imagen desde Docker Hub..."
          sudo docker pull ${{ secrets.DOCKER_USERNAME }}/get-products-db:latest

          echo "Ejecutando nuevo contenedor..."
          sudo docker run -d \
            --name get-products-db \
            -p 3010:3010 \ # Puerto expuesto de la aplicación
            -e MONGODB_HOST=${{ secrets.MONGODB_HOST }} \ # MongoDB Host (EC2 o contenedor)
            -e MONGODB_USER=${{ secrets.MONGODB_USER }} \
            -e MONGODB_PASSWORD=${{ secrets.MONGODB_PASSWORD }} \
            ${{ secrets.DOCKER_USERNAME }}/get-products-db:latest

          if sudo docker ps -f name=get-products-db | grep get-products-db; then
            echo "Contenedor corriendo correctamente."
          else
            echo "Error al iniciar el contenedor. Revisa los logs."
            exit 1
          fi
