name: Deploy MongoDB to EC2

on:
  push:
    paths:
      - '.github/workflows/mongo.yml'
      - 'Backend/DataBases/products/products.json'
      - 'Backend/DataBases/products/init-mongo.sh'
      - 'Backend/DataBases/products/dockerfile'
    branches: [ "dev3" ]
  pull_request:
    paths:
      - '.github/workflows/mongo.yml'
      - 'Backend/DataBases/products/products.json'
      - 'Backend/DataBases/products/init-mongo.sh'
      - 'Backend/DataBases/products/dockerfile'
    branches:
      - "dev1"
      - "main"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v0.1.8
        with:
          host: ${{ secrets.EC2_HOST_MONGODB }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            echo "✅ Conexión SSH exitosa con EC2"

            # 1️⃣ Verificar si Docker está instalado
            if ! command -v docker &> /dev/null; then
              echo "⚙️ Instalando Docker..."
              sudo yum update -y
              sudo yum install -y docker
              sudo systemctl start docker
              sudo systemctl enable docker
              sudo usermod -aG docker $USER
            fi

            # 2️⃣ Instalar MongoDB Shell (CLI) si no está instalado
            if ! command -v mongo &> /dev/null; then
              echo "📦 Instalando MongoDB Shell..."
              echo "[mongodb-org-7.0]
              name=MongoDB Repository
              baseurl=https://repo.mongodb.org/yum/amazon/2/mongodb-org/7.0/x86_64/
              gpgcheck=1
              enabled=1
              gpgkey=https://www.mongodb.org/static/pgp/server-7.0.asc" | sudo tee /etc/yum.repos.d/mongodb-org-7.0.repo
              
              sudo yum install -y mongodb-org-shell
            else
              echo "✅ MongoDB Shell ya está instalado."
            fi

            # 3️⃣ Verificar la instalación de MongoDB Shell
            mongo --version

            # 4️⃣ Crear directorios si no existen
            MONGO_DATA_DIR="/home/${{ secrets.EC2_USER }}/mongodb_data"
            FILES_DIR="/home/${{ secrets.EC2_USER }}/products"

            echo "📁 Creando directorios necesarios..."
            sudo mkdir -p "$MONGO_DATA_DIR"
            sudo mkdir -p "$FILES_DIR"
            sudo chown -R $USER:$USER "$MONGO_DATA_DIR"
            sudo chown -R $USER:$USER "$FILES_DIR"

            # 5️⃣ Subir archivos a la instancia EC2 (cambio de ruta)
            echo "📂 Subiendo archivos..."
            scp -o StrictHostKeyChecking=no Backend/DataBases/products/products.json ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST_MONGODB }}:$FILES_DIR/products.json
            scp -o StrictHostKeyChecking=no Backend/DataBases/products/init-mongo.sh ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST_MONGODB }}:$FILES_DIR/init-mongo.sh
            scp -o StrictHostKeyChecking=no Backend/DataBases/products/dockerfile ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST_MONGODB }}:$FILES_DIR/dockerfile

            # 6️⃣ Asegurar permisos de ejecución en `init-mongo.sh`
            echo "🔑 Configurando permisos para init-mongo.sh..."
            sudo chmod +x $FILES_DIR/init-mongo.sh

            # 7️⃣ Verificar si el contenedor de MongoDB existe y eliminarlo si es necesario
            if sudo docker ps -a --format '{{.Names}}' | grep -q "mongo_container"; then
              echo "🛑 Eliminando contenedor existente de MongoDB..."
              sudo docker stop mongo_container
              sudo docker rm mongo_container
            fi

            # 8️⃣ Construir y desplegar MongoDB en la instancia EC2
            echo "🛠 Construyendo imagen Docker para MongoDB..."
            sudo docker build -t mongo-custom -f $FILES_DIR/dockerfile $FILES_DIR

            echo "🚀 Iniciando nuevo contenedor de MongoDB..."
            sudo docker run -d \
              --name mongo_container \
              -p 27017:27017 \
              -e MONGO_INITDB_ROOT_USERNAME=${{ secrets.MONGODB_USER }} \
              -e MONGO_INITDB_ROOT_PASSWORD=${{ secrets.MONGODB_PASSWORD }} \
              -v $MONGO_DATA_DIR:/data/db \
              --restart unless-stopped \
              mongo-custom

            # 9️⃣ Esperar 15 segundos para la inicialización de MongoDB
            echo "⏳ Esperando 15 segundos para la inicialización de MongoDB..."
            sleep 15

            # 🔟 Ejecutar `init-mongo.sh` dentro del contenedor de MongoDB
            echo "🔄 Ejecutando script de importación de datos dentro del contenedor..."
            sudo docker exec mongo_container bash -c "/products/init-mongo.sh"

            # 11️⃣ Verificar si los datos están en MongoDB
            echo "🔎 Verificando si los datos están en MongoDB..."
            mongo --host 127.0.0.1 -u "${{ secrets.MONGODB_USER }}" -p "${{ secrets.MONGODB_PASSWORD }}" --authenticationDatabase admin --eval "use db_products; db.products.find().pretty();"

            echo "✅ Despliegue de MongoDB completado."
