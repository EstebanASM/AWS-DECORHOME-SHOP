name: Deploy MongoDB to EC2 

on:
  push:
    paths:
      - '.github/workflows/mongo.yml'
    branches: [ "dev3" ]
  pull_request:
    paths:
      - '.github/workflows/mongo.yml'
    branches: ["dev1", "main"]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.EC2_HOST_MONGODB }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            echo "✅ Conexión SSH exitosa con EC2"

            # 1️⃣ Verificar si Docker está instalado
            if ! command -v docker &> /dev/null; then
              echo "⚙️ Instalando Docker..."
              sudo yum update -y
              sudo yum install -y docker
              sudo systemctl start docker
              sudo systemctl enable docker
              sudo usermod -aG docker $USER
            fi

            # 2️⃣ Crear el directorio de datos de MongoDB si no existe
            MONGO_DATA_DIR="/home/${{ secrets.EC2_USER }}/mongodb_data"
            if [ ! -d "$MONGO_DATA_DIR" ]; then
              echo "📁 Creando directorio de datos de MongoDB..."
              sudo mkdir -p "$MONGO_DATA_DIR"
              sudo chown -R $USER:$USER "$MONGO_DATA_DIR"
            fi

            # 3️⃣ Eliminar contenedor MongoDB anterior si existe
            if [ "$(sudo docker ps -aq -f name=mongo_container)" ]; then
              echo "🗑 Eliminando contenedor existente de MongoDB..."
              sudo docker stop mongo_container
              sudo docker rm mongo_container
            fi

            # 4️⃣ Iniciar MongoDB con autenticación habilitada
            echo "🚀 Iniciando MongoDB..."
            sudo docker run -d \
              --name mongo_container \
              -p 27017:27017 \
              -e MONGO_INITDB_ROOT_USERNAME=${{ secrets.MONGODB_USER }} \
              -e MONGO_INITDB_ROOT_PASSWORD=${{ secrets.MONGODB_PASSWORD }} \
              -v $MONGO_DATA_DIR:/data/db \
              --restart unless-stopped \
              mongo --auth --bind_ip 0.0.0.0

            echo "✅ MongoDB desplegado en EC2 y accesible desde otras instancias"
