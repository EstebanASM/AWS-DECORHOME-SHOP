name: Deploy MongoDB to EC2

on:
  push:
    paths:
      - '.github/workflows/mongo.yml'
      - 'Backend/DataBases/products/products.json'
      - 'Backend/DataBases/products/init-mongo.sh'
      - 'Backend/DataBases/products/Dockerfile'
    branches: [ "dev3" ]
  pull_request:
    paths:
      - '.github/workflows/mongo.yml'
      - 'Backend/DataBases/products/products.json'
      - 'Backend/DataBases/products/init-mongo.sh'
      - 'Backend/DataBases/products/Dockerfile'
    branches: ["dev1", "main"]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.EC2_HOST_MONGODB }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            echo "✅ Conexión SSH exitosa con EC2"

            # 1️⃣ Verificar si Docker está instalado
            if ! command -v docker &> /dev/null; then
              echo "⚙️ Instalando Docker..."
              sudo yum update -y
              sudo yum install -y docker
              sudo systemctl start docker
              sudo systemctl enable docker
              sudo usermod -aG docker $USER
            fi

            # 2️⃣ Crear directorio de MongoDB si no existe
            MONGO_DIR="/home/${{ secrets.EC2_USER }}/mongodb"
            if [ ! -d "$MONGO_DIR" ]; then
              echo "📁 Creando directorio de MongoDB..."
              sudo mkdir -p "$MONGO_DIR"
              sudo chown -R $USER:$USER "$MONGO_DIR"
            fi

            # 3️⃣ Copiar archivos necesarios a la instancia EC2
            echo "📂 Copiando archivos..."
            scp -o StrictHostKeyChecking=no Backend/DataBases/products/products.json ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST_MONGODB }}:/home/${{ secrets.EC2_USER }}/mongodb/products.json
            scp -o StrictHostKeyChecking=no Backend/DataBases/products/init-mongo.sh ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST_MONGODB }}:/home/${{ secrets.EC2_USER }}/mongodb/init-mongo.sh
            scp -o StrictHostKeyChecking=no Backend/DataBases/products/Dockerfile ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST_MONGODB }}:/home/${{ secrets.EC2_USER }}/mongodb/Dockerfile

            # 4️⃣ Eliminar contenedor previo si existe
            if sudo docker ps -a --format '{{.Names}}' | grep -q "mongo_container"; then
              echo "🛑 Eliminando contenedor MongoDB existente..."
              sudo docker stop mongo_container
              sudo docker rm mongo_container
            fi

            # 5️⃣ Construir la imagen personalizada de MongoDB
            echo "🛠 Construyendo imagen Docker para MongoDB..."
            cd /home/${{ secrets.EC2_USER }}/mongodb
            sudo docker build -t mongo-custom .

            # 6️⃣ Iniciar MongoDB con autenticación y conexión remota
            echo "🚀 Iniciando contenedor MongoDB..."
            sudo docker run -d \
              --name mongo_container \
              -p 27017:27017 \
              -e MONGO_INITDB_ROOT_USERNAME=${{ secrets.MONGODB_USER }} \
              -e MONGO_INITDB_ROOT_PASSWORD=${{ secrets.MONGODB_PASSWORD }} \
              -v $MONGO_DIR:/data/db \
              --restart unless-stopped \
              mongo-custom

            echo "⏳ Esperando a que MongoDB inicie..."
            sleep 10

            # 7️⃣ Verificar conexión con MongoDB
            echo "🔍 Verificando conexión..."
            sudo docker exec mongo_container mongo --eval "db.runCommand({ connectionStatus: 1 })"

            echo "✅ Despliegue completado correctamente."
